<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; stroke: #dee2e6; stroke-width: 2; rx: 12; }
    .layer-box { fill: #ffffff; stroke: #adb5bd; stroke-width: 1.5; rx: 8; stroke-dasharray: 4,4; }
    .comp-client { fill: #2b8a3e; stroke: #1b5e20; stroke-width: 2; rx: 6; }
    .comp-server { fill: #1168bd; stroke: #0d3c59; stroke-width: 2; rx: 6; }
    .comp-engine { fill: #d97706; stroke: #b45309; stroke-width: 2; rx: 6; }
    .comp-db { fill: #7048e8; stroke: #5f3dc4; stroke-width: 2; rx: 6; }
    .comp-ext { fill: #495057; stroke: #343a40; stroke-width: 2; rx: 6; }
    .title { fill: #212529; font-family: sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
    .layer-title { fill: #495057; font-family: sans-serif; font-size: 13px; font-weight: bold; }
    .text { fill: #ffffff; font-family: sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
    .desc { fill: #ffffff; font-family: sans-serif; font-size: 10px; text-anchor: middle; }
    .line { stroke: #495057; stroke-width: 2; marker-end: url(#arrow); }
    .line-label { fill: #212529; font-family: sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="650" class="bg"/>
  <text x="500" y="35" class="title">Bank Document Intelligence Workbench - Detailed System Architecture</text>

  <!-- LAYER 1: CLIENT PRESENTATION LAYER -->
  <rect x="50" y="60" width="900" height="120" class="layer-box"/>
  <text x="70" y="80" class="layer-title">Layer 1: Presentation &amp; Client Interface (React / Vite / TypeScript)</text>

  <g transform="translate(80, 100)">
    <rect width="260" height="65" class="comp-client"/>
    <text x="130" y="27" class="text">React Client Application (App.tsx)</text>
    <text x="130" y="45" class="desc">UI Dashboards, File Uploads, &amp; Results Viewer</text>
  </g>

  <g transform="translate(380, 100)">
    <rect width="260" height="65" class="comp-client"/>
    <text x="130" y="27" class="text">Sample Document Repository</text>
    <text x="130" y="45" class="desc">salary-certificate.txt, account-statement.csv</text>
  </g>

  <!-- LAYER 2: API & ORCHESTRATION LAYER -->
  <rect x="50" y="200" width="900" height="150" class="layer-box"/>
  <text x="70" y="220" class="layer-title">Layer 2: Backend API &amp; Orchestration (Node.js / Express / TypeScript)</text>

  <g transform="translate(80, 245)">
    <rect width="260" height="85" class="comp-server"/>
    <text x="130" y="30" class="text">Express REST API (index.ts)</text>
    <text x="130" y="50" class="desc">Multipart Form Handling</text>
    <text x="130" y="68" class="desc">POST /api/documents/upload</text>
  </g>

  <g transform="translate(380, 245)">
    <rect width="260" height="85" class="comp-engine"/>
    <text x="130" y="30" class="text">Document Processor Engine</text>
    <text x="130" y="50" class="desc">(documentProcessor.ts)</text>
    <text x="130" y="68" class="desc">Parsing &amp; Normalization Pipeline</text>
  </g>

  <g transform="translate(680, 245)">
    <rect width="240" height="85" class="comp-ext"/>
    <text x="120" y="30" class="text">Analysis Provider</text>
    <text x="120" y="50" class="desc">(analysisProvider.ts)</text>
    <text x="120" y="68" class="desc">LLM / OCR Parser &amp; Risk Scoring</text>
  </g>

  <!-- LAYER 3: PERSISTENCE & DATA STORAGE -->
  <rect x="50" y="370" width="900" height="140" class="layer-box"/>
  <text x="70" y="390" class="layer-title">Layer 3: Persistence &amp; Audit Layer (SQLite Database)</text>

  <g transform="translate(80, 415)">
    <rect width="390" height="75" class="comp-db"/>
    <text x="195" y="30" class="text">Better-SQLite3 Storage Engine (db.ts)</text>
    <text x="195" y="52" class="desc">Relational State Management &amp; JSON Persistence</text>
  </g>

  <g transform="translate(530, 415)">
    <rect width="390" height="75" class="comp-db"/>
    <text x="195" y="25" class="text">Database Schema Tables</text>
    <text x="195" y="45" class="desc">DOCUMENTS (id, filename, status, extracted_data)</text>
    <text x="195" y="62" class="desc">PROCESSING_LOGS (audit steps &amp; error tracking)</text>
  </g>

  <!-- INTER-LAYER CONNECTORS -->
  <line x1="210" y1="165" x2="210" y2="235" class="line"/>
  <text x="245" y="205" class="line-label">HTTP REST</text>

  <line x1="510" y1="285" x2="680" y2="285" class="line"/>
  <text x="595" y="275" class="line-label">Payload Stream</text>

  <line x1="210" y1="330" x2="210" y2="405" class="line"/>
  <text x="240" y="370" class="line-label">SQL Queries</text>

</svg>
