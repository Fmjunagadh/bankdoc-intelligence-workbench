<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <style>
    .boundary { fill: #f1f3f5; stroke: #ced4da; stroke-width: 2; rx: 10px; stroke-dasharray: 6,6; }
    .client { fill: #2b8a3e; stroke: #1b5e20; stroke-width: 2; rx: 6; }
    .server { fill: #1168bd; stroke: #0d3c59; stroke-width: 2; rx: 6; }
    .db { fill: #7048e8; stroke: #5f3dc4; stroke-width: 2; rx: 6; }
    .ext { fill: #6c757d; stroke: #495057; stroke-width: 2; rx: 6; }
    .text { fill: #ffffff; font-family: sans-serif; font-size: 13px; text-anchor: middle; font-weight: bold; }
    .desc { fill: #ffffff; font-family: sans-serif; font-size: 10px; text-anchor: middle; }
    .line { stroke: #495057; stroke-width: 2; marker-end: url(#arrow2); }
    .label { fill: #212529; font-family: sans-serif; font-size: 10px; text-anchor: middle; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#ffffff" rx="10"/>
  <text x="450" y="30" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#212529">High-Level Architecture (HLD) - Container Diagram</text>

  <!-- Boundary Box -->
  <rect x="150" y="60" width="560" height="350" class="boundary"/>
  <text x="430" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#495057" text-anchor="middle">Bank Document Intelligence Workbench System Containers</text>

  <!-- Frontend Client -->
  <g transform="translate(180, 120)">
    <rect width="140" height="110" class="client"/>
    <text x="70" y="35" class="text">React Frontend</text>
    <text x="70" y="55" class="desc">Vite, TypeScript</text>
    <text x="70" y="75" class="desc">UI &amp; Dashboard</text>
    <text x="70" y="95" class="desc">client/src/</text>
  </g>

  <!-- Backend Server -->
  <g transform="translate(360, 120)">
    <rect width="150" height="110" class="server"/>
    <text x="75" y="35" class="text">Express Backend</text>
    <text x="75" y="55" class="desc">Node.js, REST API</text>
    <text x="75" y="75" class="desc">documentProcessor</text>
    <text x="75" y="95" class="desc">server/src/</text>
  </g>

  <!-- Database -->
  <g transform="translate(360, 270)">
    <rect width="150" height="110" class="db"/>
    <text x="75" y="35" class="text">SQLite Database</text>
    <text x="75" y="55" class="desc">Better-SQLite3</text>
    <text x="75" y="75" class="desc">Documents &amp; Logs</text>
    <text x="75" y="95" class="desc">db.ts</text>
  </g>

  <!-- External Analysis Provider -->
  <g transform="translate(740, 120)">
    <rect width="130" height="110" class="ext"/>
    <text x="65" y="35" class="text">Analysis Provider</text>
    <text x="65" y="55" class="desc">LLM / OCR Parser</text>
    <text x="65" y="75" class="desc">Risk Scoring</text>
    <text x="65" y="95" class="desc">analysisProvider.ts</text>
  </g>

  <!-- Connectors -->
  <line x1="320" y1="175" x2="352" y2="175" class="line"/>
  <text x="336" y="165" class="label">HTTP</text>

  <line x1="435" y1="230" x2="435" y2="260" class="line"/>
  <text x="455" y="248" class="label">SQL</text>

  <line x1="510" y1="160" x2="732" y2="160" class="line"/>
  <text x="621" y="150" class="label">Parse Request</text>
</svg>
